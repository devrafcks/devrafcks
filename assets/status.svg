<circle class="p" cx="17" cy="17" r="6" fill="#ffbc00"/>
<circle cx="17" cy="17" r="5" fill="#ffbc00"/>
<text x="34" y="22" font-size="14"><tspan fill="#fff6e0">open to new projects</tspan><tspan fill="#a8978a">  ·  São Paulo, BR</tspan><tspan fill="#ffbc00" class="cur">_</tspan></text>
</svg>