<svg xmlns="http://www.w3.org/2000/svg" width="330" height="34" viewBox="0 0 330 34">
<style>text{font-family:ui-monospace,'JetBrains Mono',Consolas,'Courier New',monospace}
.p{transform-box:fill-box;transform-origin:center;animation:pl 2s ease-out infinite}
