<svg xmlns="http://www.w3.org/2000/svg" width="880" height="138" viewBox="0 0 880 138">
<style>
text{font-family:ui-monospace,'JetBrains Mono',Consolas,'Courier New',monospace}
.node{animation:nd 8.64s ease-out infinite}
@keyframes nd{0%{fill:#ffbc00}12%{fill:#ffbc00}30%,100%{fill:#1e1416}}
.ring{opacity:0;animation:rg 8.64s ease-out infinite}
@keyframes rg{0%{opacity:.95;transform:scale(.6)}18%{opacity:0;transform:scale(1.5)}100%{opacity:0}}
.ring{transform-box:fill-box;transform-origin:center}
.pulse{animation:mv 8.64s linear infinite}
@keyframes mv{0%{transform:translateX(0)}83.3%{transform:translateX(740px)}100%{transform:translateX(740px);opacity:0}}
.dash{animation:ds 1.4s linear infinite}@keyframes ds{to{stroke-dashoffset:-14}}
</style>
<defs>
